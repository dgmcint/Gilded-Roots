[package]
name = "gilded-roots"
version = "1.0.4"
edition = "2021"
rust-version = "1.92"
description = "Family tree and genealogy app"
license = "MIT"
authors = ["Doyle McIntosh (DGMCINT)"]

[dependencies]
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_extras = { version = "0.29", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
cpal = "0.15"
hound = "3"
unicode-normalization = "0.1"
miniz_oxide = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.bundle]
name = "Gilded Roots"
identifier = "local.gildedroots"
short_description = "Family tree and genealogy"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/256x256.png", "icons/512x512.png"]

[package.metadata.deb]
name = "gilded-roots"
maintainer = "Doyle McIntosh (DGMCINT)"
depends = "$auto"
section = "utils"
assets = [
  ["target/release/gilded-roots", "usr/bin/", "755"],
  ["packaging/gilded-roots.desktop", "usr/share/applications/", "644"],
  ["icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/gilded-roots.png", "644"],
]
